<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#05080c">
  <title>Inventa · Ingresar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">IN</div>
      <h1>Inventa</h1>
      <p>Tus ventas y ganancias, claras todos los días</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert-banner {{ 'alert-danger' if cat == 'error' else 'alert-info' }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" id="login-form" autocomplete="on">
      <div class="form-group">
        <label class="form-label" for="email">Correo</label>
        <input name="email" id="email" type="email" class="form-control input-grande" placeholder="tu@correo.com"
          required autocomplete="username" autofocus inputmode="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="pw-input">Contraseña</label>
        <div class="input-wrap">
          <input name="password" type="password" class="form-control input-grande form-control-pw"
            required autocomplete="current-password" id="pw-input">
          <button type="button" class="pw-toggle" onclick="togglePw()" aria-label="Mostrar u ocultar contraseña">
            <svg id="eye-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <label class="check">
        <input type="checkbox" name="recordar" value="1" checked> Mantener la sesión abierta en este dispositivo
      </label>
      <button type="submit" class="btn btn-primary btn-lg btn-block" id="btn-login">Ingresar</button>
    </form>
  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', function () {
    const btn = document.getElementById('btn-login');
    btn.innerHTML = '<span class="spinner"></span> Ingresando...';
    btn.disabled = true;
  });

  function togglePw() {
    const input = document.getElementById('pw-input');
    const visible = input.type === 'text';
    input.type = visible ? 'password' : 'text';
    document.getElementById('eye-icon').innerHTML = visible
      ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  }
</script>
</body>
</html>
