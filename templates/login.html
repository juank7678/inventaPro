<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inventa — Acceso</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    /* Grid decorativo de fondo */
    .login-grid {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(59,158,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59,158,255,0.03) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse 70% 70% at 50% 50%, black 0%, transparent 100%);
    }
    .login-orb {
      position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0;
    }
    .orb-1 { width: 500px; height: 500px; top: -150px; left: 50%; transform: translateX(-50%); background: rgba(59,158,255,0.08); }
    .orb-2 { width: 350px; height: 350px; bottom: -100px; right: -80px; background: rgba(34,211,165,0.06); }
    .orb-3 { width: 280px; height: 280px; bottom: 10%; left: -60px; background: rgba(167,139,250,0.05); }

    .pw-toggle {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--text-dim); cursor: pointer;
      padding: 2px; transition: color .2s;
    }
    .pw-toggle:hover { color: var(--text-muted); }
    .input-wrap { position: relative; }
    .form-control-pw { padding-right: 40px; }
  </style>
</head>
<body>
<div class="login-grid"></div>
<div class="login-orb orb-1"></div>
<div class="login-orb orb-2"></div>
<div class="login-orb orb-3"></div>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">IN</div>
      <h1>Inventa</h1>
      <p>Business Intelligence para PYMEs</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="alert-banner alert-danger" style="margin-bottom:16px">⚠️ {{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="POST" id="login-form" autocomplete="on">
      <div class="form-group">
        <label class="form-label">Correo electrónico</label>
        <input name="email" type="email" class="form-control" placeholder="tu@empresa.com"
          required autocomplete="email" autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <div class="input-wrap">
          <input name="password" type="password" class="form-control form-control-pw"
            placeholder="••••••••" required autocomplete="current-password" id="pw-input">
          <button type="button" class="pw-toggle" onclick="togglePw()" title="Mostrar/ocultar" id="pw-btn">
            <svg id="eye-icon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;margin-top:10px" id="btn-login">
        Ingresar
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </form>

    <div class="demo-info">
      <strong style="color:var(--accent)">🔑 Credenciales demo</strong><br>
      Email: <code style="color:var(--text)">admin@inventa.com</code><br>
      Clave: <code style="color:var(--text)">inventa2024</code>
    </div>
  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', function(){
    const btn = document.getElementById('btn-login');
    btn.innerHTML = '<span class="spinner"></span> Ingresando...';
    btn.disabled = true;
  });

  function togglePw() {
    const input = document.getElementById('pw-input');
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    document.getElementById('eye-icon').innerHTML = isText
      ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  }
</script>
</body>
</html>
